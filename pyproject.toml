[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionguard-ai"
version = "0.12.0"
description = "面向工业安全场景的多模态视觉风险智能体 MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "python-multipart>=0.0.9",
  "pillow>=10.0,<12.0",
  "pydantic>=2.6,<3.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
yolo = ["ultralytics>=8.2,<9.0"]
firebench = [
  "joblib>=1.3",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "safetensors>=0.4",
  "timm==1.0.21",
  "torch>=2.2",
  "torchvision>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["models*", "scripts*", "tests*"]
